<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New - InvestmentGiftCard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Create New</h1>
            <p class="subtitle">Create a new investment gift card</p>
            <form id="createForm">
                <!-- Form fields will be added here -->
                <div class="form-group">
                    <label for="cardName">Card Name</label>
                    <input type="text" id="cardName" name="cardName" placeholder="Enter card name" required>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn">Create</button>
                    <button type="button" class="btn btn-secondary" onclick="location.href='/dashboard.html'">Back</button>
                </div>
            </form>
        </div>
    </div>
</body>

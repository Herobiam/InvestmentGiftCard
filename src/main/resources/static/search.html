<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - InvestmentGiftCard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Search</h1>
            <p class="subtitle">Search for investment gift cards</p>
            <form id="searchForm">
                <div class="form-group">
                    <label for="searchQuery">Search</label>
                    <input type="text" id="searchQuery" name="searchQuery" placeholder="Enter search term" required>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn">Search</button>
                    <button type="button" class="btn btn-secondary" onclick="location.href='/dashboard.html'">Back</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

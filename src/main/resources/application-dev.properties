# Development Profile - uses H2 in-memory database
spring.application.name=InvestmentGiftCard

# Server Configuration
server.port=8080

# H2 In-Memory Database (for development)
spring.datasource.url=jdbc:h2:mem:investmentgiftcard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration (override PostgreSQL settings)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.investmentgiftcard=DEBUG
